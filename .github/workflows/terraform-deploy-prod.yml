name: Terraform Deploy PROD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true

jobs:
  deploy-prod:
    name: Deploy PROD Infrastructure
    runs-on: ubuntu-latest
    environment:
      name: terraform-apply

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: environments/prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create reviewed PROD plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file terraform.tfvars \
            -out prod.tfplan

      - name: Apply reviewed PROD plan
        run: terraform apply -input=false prod.tfplan
